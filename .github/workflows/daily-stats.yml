name: Daily Stats Snapshot

on:
  schedule:
    # Run every day at 00:00 UTC (16:00 PST / 17:00 PDT)
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch fresh GitHub & LeetCode stats
        run: node scripts/fetch-stats.mjs

      - name: Build minified JS
        run: npm run build:js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/js/stats-data.js src/js/min/stats-data.min.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(stats): daily update GitHub and LeetCode stats snapshot [skip ci]" && git push)
